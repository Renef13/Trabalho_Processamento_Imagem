[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "plant-disease-pi"
version = "0.1.0"
description = "Pipeline de processamento de imagens para deteccao de doencas em plantas."
requires-python = ">=3.10"

[tool.setuptools]
packages = ["plant_disease", "plant_disease.utils"]
